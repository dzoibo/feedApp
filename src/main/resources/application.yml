# Logger
logging.level:
  web: DEBUG
  '[com.bptn.feedApp]': DEBUG

# Active Profile
spring:
  profiles:
     active: name_of_active_profile

# Banner Text
  banner:
    charset: UTF-8
    location: classpath:/banner/academy.txt

# Jackson Settings
  jackson:
    time-zone: America/Toronto
    date-format: "yyyy-MM-dd HH:mm:ss"
# Email Settings
  mail:
    username: team1.obsidi@gmail.com
    password: eavo pjjz gujb ixkb
    host: smtp.gmail.com
    port: 587
    protocol: smtp
    properties:
      mail:
       smtp:
        auth: true
        starttls:
            enable: true
# Datasource (override with environment variables)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/feedApp}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}

# Common Database Settings
sql:
  init:
    continue-on-error: false
jpa:
  show-sql: true
  open-in-view: false
  properties:
    jakarta.persistence.sharedCache.mode: ENABLE_SELECTIVE
    hibernate:
      format_sql: true
  hibernate:
    naming:
      physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
