# Logger
logging.level:
  web: DEBUG
  '[com.bptn.feedApp]': DEBUG

# Active Profile
spring:
  profiles:
    active: default

# Banner Text
  banner:
    charset: UTF-8
    location: classpath:/banner/academy.txt

# Jackson Settings
  jackson:
    time-zone: America/Toronto
    date-format: "yyyy-MM-dd HH:mm:ss"

# Datasource (override with environment variables)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/feedapp}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:}

# Common Database Settings
  sql:
    init:
      continue-on-error: false
  jpa:
    show-sql: true
    open-in-view: false
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      jakarta:
        persistence:
          sharedCache:
            mode: ENABLE_SELECTIVE
      hibernate:
        '[format_sql]': true
